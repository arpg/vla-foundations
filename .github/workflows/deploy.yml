name: Deploy to Production

on:
  push:
    branches: [ main ]
    paths-ignore:
      # Ignore changes that don't affect the site
      - 'src/assignments/**'
      - 'scripts/**'
      - 'tests/**'
      - 'private/**'
      - '**.md'
      - '.github/**'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
          npm ci

      - name: Build
        run: |
          cd $GITHUB_WORKSPACE
          npm run build

      - name: Deploy to local web root
        run: rsync -av --delete $GITHUB_WORKSPACE/out/ /var/www/vlm-robotics.dev/out/
