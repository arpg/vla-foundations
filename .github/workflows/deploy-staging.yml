name: Deploy Staging Branch

on:
  push:
    branches: [ staging ]
    paths-ignore:
      # Ignore changes that don't affect the site
      - 'src/assignments/**'
      - 'scripts/**'
      - 'tests/**'
      - 'private/**'
      - '**.md'
      - '.github/**'
      - 'data/**'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'uv.lock'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
          npm ci

      - name: Build
        run: |
          cd $GITHUB_WORKSPACE
          npm run build

      - name: Deploy to staging subdirectory
        run: |
          mkdir -p /var/www/vlm-robotics.dev/out/staging
          rsync -av --delete $GITHUB_WORKSPACE/out/ /var/www/vlm-robotics.dev/out/staging/
          echo "Staging deployment completed at $(date)"
